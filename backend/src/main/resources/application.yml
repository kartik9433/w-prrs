server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: w-prrs-backend
  profiles:
    active: dev

  # Dev profile uses in-memory H2 with MySQL syntax emulation and schema auto-generation for zero-setup execution
  datasource:
    url: jdbc:h2:mem:wprrs_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDER=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "http://localhost:4200,http://127.0.0.1:4200"

logging:
  level:
    root: INFO
    com.wprrs: DEBUG
    org.hibernate.SQL: WARN
